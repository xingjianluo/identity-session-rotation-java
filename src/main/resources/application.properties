# --- Local identity session rotation ---
# Access token lifetime (seconds); short lived by design.
security.access-token-ttl-seconds=300
# Refresh token (and session) lifetime (seconds).
security.refresh-token-ttl-seconds=3600

# Audit records are logged at INFO by AuditService.
logging.level.com.github.xingjianluo.identitysessionrotationjava=INFO
