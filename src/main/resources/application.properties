spring.application.name=identity-session-rotation

# 访问令牌有效期（秒），默认 5 分钟
app.security.access-token-ttl-seconds=300
# 刷新令牌有效期（秒），默认 14 天
app.security.refresh-token-ttl-seconds=1209600
# 令牌签发者标识
app.security.issuer=local-identity
# 每个账号允许同时保持的活跃登录（设备会话）数上限，超出后按最久未活动淘汰
app.security.max-active-sessions-per-account=5

# 启动演示账户（仅本地开发使用）
app.security.bootstrap-accounts[0].username=alice
app.security.bootstrap-accounts[0].password=alice-pwd
app.security.bootstrap-accounts[0].roles[0]=USER
app.security.bootstrap-accounts[1].username=bob
app.security.bootstrap-accounts[1].password=bob-pwd
app.security.bootstrap-accounts[1].roles[0]=USER
app.security.bootstrap-accounts[2].username=admin
app.security.bootstrap-accounts[2].password=admin-pwd
app.security.bootstrap-accounts[2].roles[0]=ADMIN
